<style>
:root{--mah:#4e1912;--mah2:#3a110c;--d:58,17,12;--cream:#f5efe5;--card:#fffaf2;--ink:#2a1814;--mut:#7a665d;--euc:#7f9c8d;--cap:#7f9c8d;--tk:#fff;--line:rgba(42,24,20,.14);--l0:#8fae9d;--l1:#7b9b8a;--l2:#a9c4b4;--l3:#6a8a79;--stem:#8a6a52}
/* палитры на выбор: ?c=1 эспрессо · коньяк · серо-бежевый, ?c=2 бордо · мокко · беж, ?c=3 шоколад · голубой */
html[data-c="1"]{--mah:#33211a;--mah2:#241712;--d:36,23,18;--cream:#e2dcd4;--card:#f0ebe4;--ink:#2a1c16;--mut:#74665b;--euc:#a5552b;--cap:#a5552b;--tk:#f6ebdd;--line:rgba(42,28,22,.17);--l0:#b98a5e;--l1:#a5552b;--l2:#d6b48c;--l3:#8a4a25;--stem:#6b4a36}
html[data-c="2"]{--mah:#6d1a27;--mah2:#450f19;--d:69,15,25;--cream:#efe6da;--card:#f9f3ea;--ink:#2e1b18;--mut:#7b655c;--euc:#8b6f5d;--cap:#8b6f5d;--tk:#fbf3e8;--line:rgba(46,27,24,.15);--l0:#cbb39c;--l1:#b59a84;--l2:#e0cdb9;--l3:#a08572;--stem:#7a5a4a}
html[data-c="3"]{--mah:#40261a;--mah2:#2e1b12;--d:46,27,18;--cream:#e8eff6;--card:#f8fbfd;--ink:#2b1a12;--mut:#6b655f;--euc:#a9c5df;--cap:#5d86ae;--tk:#3a2217;--line:rgba(43,26,18,.14);--l0:#a9c5df;--l1:#8fb2d3;--l2:#c6daec;--l3:#7ea3c7;--stem:#7a5a48}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--mah2);color:var(--ink);font:400 16px/1.65 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
ul{list-style:none;padding:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
iframe{border:0;display:block;width:100%}
[hidden]{display:none!important}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
h1,h2{font-weight:300;text-transform:uppercase;letter-spacing:.09em;line-height:1.18}
.cap{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}

/* фон на широком экране: красное дерево и эвкалипт */
.bg{position:fixed;inset:0;z-index:-1;background:var(--mah);overflow:hidden}
.bg .wood{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,rgba(255,215,185,.1),transparent 70%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.4))}
.euc{position:absolute;z-index:1;width:var(--w,520px);overflow:visible;pointer-events:none;transform-origin:0 50%;animation:sway var(--t,7s) ease-in-out infinite alternate;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
@keyframes sway{from{transform:rotate(var(--r,0deg))}to{transform:rotate(calc(var(--r,0deg) + 3deg))}}
.e1{--w:min(44vw,600px);--r:22deg;left:-3vw;top:2vw}
.e2{--w:min(40vw,540px);--r:160deg;--t:9s;right:-36vw;top:30vh}
.e3{--w:min(38vw,500px);--r:-24deg;--t:8s;left:-2vw;bottom:8vh}

.col{width:min(480px,100%);margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 80px rgba(0,0,0,.5);position:relative}

/* главный экран: фото гостей салона */
.top{position:relative;height:min(88svh,760px);min-height:540px;overflow:hidden;background:var(--mah2);color:var(--cream);display:flex;flex-direction:column;justify-content:flex-end;text-align:center;isolation:isolate}
.top .ph{position:absolute;left:0;top:0;width:100%;height:80%;object-fit:cover;object-position:50% 20%;opacity:0;transform:scale(1.06);transition:opacity 1.4s ease,transform 7s ease-out;z-index:-2}
.top .ph.on{opacity:1;transform:none}
.top::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(var(--d),.35) 0,transparent 16%,transparent 42%,rgba(var(--d),.74) 60%,var(--mah2) 79%)}
.top .in{padding:0 24px 26px}
.top .lg{width:84px;margin:0 auto 16px;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
.top h1{font-size:18px;letter-spacing:.14em}
.top p{opacity:.9;font-size:14.5px;margin:10px auto 18px;max-width:300px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;border:1px solid rgba(245,239,229,.35);font-size:12.5px;background:rgba(var(--d),.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bars{display:flex;gap:6px;justify-content:center;margin-top:20px}
.bars i{width:28px;height:2px;border-radius:2px;background:rgba(245,239,229,.3);overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0;background:var(--cream);transform:scaleX(0);transform-origin:0 50%}
.bars i.on::after{animation:bar 5s linear forwards}
.bars i.done::after{transform:none}
@keyframes bar{to{transform:none}}

/* бегущая строка услуг */
.tick{background:var(--euc);color:var(--tk);overflow:hidden;white-space:nowrap;padding:11px 0}
.tick div{display:inline-block;animation:tk 34s linear infinite}
.tick span{display:inline-flex;align-items:center}
.tick span::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6;margin:0 1.3em}
@keyframes tk{to{transform:translateX(-50%)}}

.blk{padding:34px 20px 6px}
.blk>.cap{color:var(--cap);display:block;margin-bottom:8px}
h2{font-size:22px;margin-bottom:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 24px;border-radius:99px;background:var(--mah);color:var(--cream);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;transition:transform .3s,background .3s,color .3s}
.btn:hover{transform:translateY(-2px);background:var(--mah2)}
.blk>.btn{margin-top:12px}

/* строки мессенджеров */
.mr{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;padding:14px 20px 14px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:transform .3s,background .3s,color .3s,border-color .3s}
.mr+.mr{margin-top:10px}
.mr .mi{width:52px;height:52px;border-radius:50%;background:var(--mah);color:var(--cream);display:grid;place-items:center;font-size:21px;transition:background .3s,color .3s}
.mr b{display:block;font-weight:500;font-size:17px;letter-spacing:.02em}
.mr small{color:var(--mut);font-size:13px;transition:color .3s}
.mr>svg{font-size:20px;transition:transform .3s}
@media(hover:hover){
  .mr:hover{background:var(--mah);color:var(--cream);border-color:var(--mah);transform:translateX(4px)}
  .mr:hover .mi{background:var(--cream);color:var(--mah)}.mr:hover small{color:inherit;opacity:.75}.mr:hover>svg{transform:translateX(5px)}
}

/* купон */
.cp{margin:26px 20px 0;padding:18px 16px;border-radius:18px;border:1.5px dashed var(--mah);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mah)}
.cp b{font-weight:300;font-size:34px;line-height:1;white-space:nowrap}
.cp span{font-size:13px;line-height:1.4;flex:1;min-width:0}
.cp .code{background:var(--mah);color:var(--cream);border-radius:99px;padding:10px 14px;letter-spacing:.12em;font-weight:500;white-space:nowrap;flex:none}

/* услуги */
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;gap:14px;padding:13px 2px;cursor:pointer;font-weight:500;font-size:15.5px}
summary::-webkit-details-marker{display:none}
summary img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
summary::after{content:"";margin-left:auto;flex:none;width:14px;height:14px;background:linear-gradient(var(--mah),var(--mah)) 50%/100% 1.5px no-repeat,linear-gradient(var(--mah),var(--mah)) 50%/1.5px 100% no-repeat;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
.sv{padding:0 2px 18px}
.sv>img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;margin-bottom:12px}
.sv p{color:var(--mut);font-size:14.5px;margin-bottom:12px}
.sv .row{display:flex;gap:8px}
.sv .btn{height:46px;font-size:12px;padding:0 10px;flex:1}
.sv .ic{flex:none;width:46px;padding:0;font-size:18px;background:none;color:var(--mah);box-shadow:inset 0 0 0 1px var(--mah)}
.sv .ic:hover{background:var(--mah);color:var(--cream)}

/* ленты фото */
.wk{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 20px 6px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wk::-webkit-scrollbar{display:none}
.wk img{flex:none;width:58%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;scroll-snap-align:center;background:#e6dccd}

/* адрес */
.ad ul{display:grid;gap:12px;font-size:15.5px;margin-bottom:16px}
.ad li{display:flex;gap:12px;align-items:center}
.ad li svg{color:var(--mah);font-size:18px}
.map{border-radius:14px;overflow:hidden;background:#e6dccd}
.map iframe{height:260px}
.lks{margin-top:26px;border-top:1px solid var(--line)}
.lk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 2px;border-bottom:1px solid var(--line);font-weight:500}
.lk svg{color:var(--mah);font-size:18px}
footer{padding:30px 20px calc(40px + env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:11px 20px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.pal{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;border-radius:99px;background:rgba(20,14,12,.86);color:#fff;font-size:12px;letter-spacing:.08em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pal button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.pal button.on{border-color:#fff}
.has-pal footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
@media(max-width:760px){.bg{display:none}.col{box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

const S = b => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${b}</svg>`;
const IC = {
  wa: S('<path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm0 1.800a8.200 8.200 0 1 1-4.200 15.200l-.4-.2-2.800.7.8-2.700-.3-.4A8.200 8.200 0 0 1 12 3.800Z"/><path d="M9 7.200c-.2-.4-.4-.4-.6-.4h-.6c-.2 0-.5.1-.7.4-.3.3-1 1-1 2.300 0 1.400 1 2.700 1.100 2.900.2.2 2 3.100 4.900 4.300 2.400 1 2.900.8 3.400.7.5 0 1.700-.7 1.900-1.300.3-.7.3-1.200.2-1.400-.1-.1-.3-.2-.6-.3l-1.900-1c-.3-.1-.5-.1-.7.2l-.9 1.100c-.1.2-.3.2-.6.1-.3-.2-1.200-.5-2.300-1.400-.9-.8-1.400-1.700-1.600-2-.2-.3 0-.5.1-.6l.5-.5.3-.5c.1-.2 0-.4 0-.5L9 7.200Z"/>'),
  tg: S('<path d="M21.900 4.300 18.700 19.400c-.2 1-.9 1.300-1.700.8l-4.800-3.600-2.300 2.200c-.3.3-.5.5-1 .5l.3-4.900 8.900-8c.4-.3-.1-.5-.6-.2l-11 6.900-4.700-1.500c-1-.3-1-1 .2-1.500L20.500 3c.9-.3 1.600.2 1.400 1.300Z"/>'),
  vk: S('<path d="M12.800 17.500C7 17.500 3.700 13.600 3.600 7h2.900c.1 4.800 2.200 6.900 3.900 7.300V7h2.700v4.200c1.700-.2 3.400-2.100 4-4.200h2.700c-.4 2.600-2.300 4.500-3.700 5.200 1.400.6 3.500 2.300 4.300 5.300h-3c-.6-2-2.200-3.500-4.300-3.700v3.700h-.3Z"/>'),
  max: S('<path d="M12 2.500C6.500 2.500 2.500 6.600 2.500 12c0 1.900.5 3.600 1.400 5.100L3 21.500l4.600-1.100c1.300.7 2.800 1.100 4.400 1.100 5.500 0 9.500-4.100 9.500-9.500S17.500 2.500 12 2.500Zm0 4.300a5.200 5.200 0 1 1 0 10.400 5.200 5.200 0 0 1 0-10.400Zm0 2.400a2.800 2.800 0 1 0 0 5.600 2.800 2.800 0 0 0 0-5.600Z"/>'),
  ig: S('<path fill-rule="evenodd" d="M7.500 2.500h9a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-9a5 5 0 0 1-5-5v-9a5 5 0 0 1 5-5Zm0 1.900a3.100 3.100 0 0 0-3.100 3.100v9a3.100 3.100 0 0 0 3.100 3.100h9a3.100 3.100 0 0 0 3.100-3.100v-9a3.100 3.100 0 0 0-3.100-3.100h-9ZM12 7.400a4.600 4.600 0 1 1 0 9.200 4.600 4.600 0 0 1 0-9.200Zm0 1.900a2.700 2.700 0 1 0 0 5.400 2.700 2.700 0 0 0 0-5.400Zm4.900-3.300a1.100 1.100 0 1 1 0 2.200 1.100 1.100 0 0 1 0-2.200Z"/>'),
  tel: S('<path d="M6.600 2.800 9 2.300c.5-.1 1 .2 1.200.7l1.100 2.900c.2.4 0 .9-.3 1.200L9.400 8.500a11.500 11.500 0 0 0 6.100 6.100l1.400-1.600c.3-.4.8-.5 1.200-.3l2.900 1.100c.5.2.8.7.7 1.200l-.5 2.400c-.1.5-.6.9-1.100.9C11 18.300 5.700 13 5.700 3.900c0-.5.4-1 .9-1.100Z"/>'),
  arrow: S('<path d="M13.300 5.300 20 12l-6.700 6.700-1.400-1.400 4.300-4.300H4v-2h12.200l-4.300-4.300 1.400-1.400Z"/>'),
  pin: S('<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 4.500a2.500 2.500 0 1 1 0 5 2.500 2.500 0 0 1 0-5Z"/>'),
  clock: S('<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-1 3v5.400l4 2.400 1-1.700-3-1.800V7h-2Z"/>')
};
const ext = 'target="_blank" rel="noopener"';
const hh = h => String(h).padStart(2, '0') + ':00';
const M = Object.fromEntries(SALON.messengers.map(m => [m.k, m]));
const tel = 'tel:' + SALON.phone.replace(/[^+\d]/g, '');

$('lead').textContent = SALON.lead;
$('chipAddr').textContent = SALON.addressShort;
$('book').href = SALON.book;
$('rows').innerHTML = SALON.messengers.map(m => `<a class="mr" href="${m.url}" ${ext}><span class="mi">${IC[m.k]}</span><span><b>${m.name}</b><small>${m.sub}</small></span>${IC.arrow}</a>`).join('');
$('tick').innerHTML = SALON.services.map(s => `<span>${s.k}</span>`).join('').repeat(2);

const quick = SALON.quick.map(k => `<a class="btn ic" href="${M[k].url}" ${ext} aria-label="Написать в ${M[k].name}">${IC[k]}</a>`).join('');
$('acc').innerHTML = SALON.services.map(s => `<details><summary><img src="img/${s.i}.jpg" alt="" loading="lazy" width="46" height="46">${s.n}</summary><div class="sv"><img src="img/${s.i}.jpg" alt="${s.n}" loading="lazy"><p>${s.d}</p><div class="row"><a class="btn" href="${SALON.book}" ${ext}>Записаться</a>${quick}</div></div></details>`).join('');
// открыт только один раздел услуг
document.querySelectorAll('#acc details').forEach(d => d.addEventListener('toggle', () => { if (d.open) document.querySelectorAll('#acc details[open]').forEach(o => { if (o !== d) o.open = false; }); }));

$('wk').innerHTML = SALON.works.map(n => `<img src="img/w${n}.jpg" alt="Работа мастера Дом D'ajour" loading="lazy">`).join('');
$('inr').innerHTML = SALON.interior.map((a, n) => `<img src="img/in${n + 1}.jpg" alt="${a}" loading="lazy">`).join('');

$('facts').innerHTML = `<li>${IC.pin}${SALON.address}</li><li>${IC.clock}Ежедневно ${hh(SALON.hours[0])}–${hh(SALON.hours[1])}</li><li>${IC.tel}<a href="${tel}">${SALON.phone}</a></li>`;
$('map').src = SALON.mapWidget;
$('lks').innerHTML = [['Открыть в Яндекс Картах', SALON.map], ['Отзывы гостей', SALON.map + 'reviews/'], ['Школа красоты D’ajour — курсы', SALON.school]]
  .map(([t, u]) => `<a class="lk" href="${u}" ${ext}><span>${t}</span>${IC.arrow}</a>`).join('');
$('foot').textContent = `© ${new Date().getFullYear()} Дом D’ajour · салон и школа красоты`;


// промокод: копирование по нажатию
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
if (SALON.promo) {
  $('cp').hidden = false; $('cpPct').textContent = SALON.promo.pct; $('cpCode').textContent = SALON.promo.code;
  $('cpCode').addEventListener('click', () => {
    const ok = () => toast('Промокод скопирован');
    navigator.clipboard ? navigator.clipboard.writeText(SALON.promo.code).then(ok, () => toast('Промокод: ' + SALON.promo.code)) : toast('Промокод: ' + SALON.promo.code);
  });
}

// палитра: ?c=1…3, переключатель внизу (временный)
const pal = $('pal'), tc = document.querySelector('meta[name=theme-color]');
const setPal = c => {
  document.documentElement.dataset.c = c;
  pal.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.c === c));
  tc.content = getComputedStyle(document.documentElement).getPropertyValue('--mah2').trim();
};
if (pal) {
  document.body.classList.add('has-pal');
  pal.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setPal(b.dataset.c); history.replaceState(null, '', b.dataset.c === '0' ? location.pathname : '?c=' + b.dataset.c); });
  setPal(document.documentElement.dataset.c);
}

// главный экран: фото сменяются сами
const ph = [...document.querySelectorAll('.top .ph')], bars = [...$('bars').children];
let cur = 0;
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
  ph.forEach(i => { if (i.dataset.src) { const p = new Image(); p.src = i.dataset.src; p.onload = () => { i.src = i.dataset.src; i.dataset.ok = 1; }; } });
  setInterval(() => {
    const nx = (cur + 1) % ph.length;
    if (ph[nx].dataset.src && !ph[nx].dataset.ok) return;
    ph[cur].classList.remove('on'); ph[nx].classList.add('on'); cur = nx;
    bars.forEach((b, n) => { b.classList.toggle('done', n < cur); b.classList.toggle('on', n === cur); });
  }, 5000);
} else $('bars').hidden = true;

// ветки эвкалипта на широком экране
function branch(n = 9, len = 520, bend = -46) {
  let s = `<path d="M0 0 Q ${len * 0.5} ${bend} ${len} ${bend * 0.25}" fill="none" style="stroke:var(--stem)" stroke-width="2.4" stroke-linecap="round"/>`;
  for (let i = 0; i < n; i++) {
    const t = (i + 0.7) / n, x = 2 * (1 - t) * t * len * 0.5 + t * t * len, y = 2 * (1 - t) * t * bend + t * t * bend * 0.25;
    const sz = (1 - t * 0.5) * (54 + (i * 37) % 19), side = i % 2 ? 1 : -1, ang = side * (56 + (i * 53) % 26) - t * 12;
    s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})"><path d="M0 0C${sz * 0.22} ${-sz * 0.56} ${sz * 0.9} ${-sz * 0.5} ${sz} 0C${sz * 0.9} ${sz * 0.5} ${sz * 0.22} ${sz * 0.56} 0 0Z" style="fill:var(--l${i % 4})"/><path d="M0 0L${sz * 0.9} 0" stroke="rgba(255,255,255,.3)" stroke-width="1"/></g>`;
  }
  return s;
}
if (innerWidth > 760) document.querySelectorAll('svg.euc').forEach(el => { el.setAttribute('viewBox', '-30 -130 620 250'); el.innerHTML = branch(+el.dataset.n || 9, 520, +el.dataset.bend || -46); });
</script>
</body>
