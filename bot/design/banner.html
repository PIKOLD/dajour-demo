<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:ital,wght@1,600&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:640px;height:360px;overflow:hidden;background:#160a07}
.b{position:relative;width:640px;height:360px;background:#160a07;color:#f6f0e6;overflow:hidden}
.ph{position:absolute;right:-10px;top:24px;width:250px;height:340px;border-radius:125px 125px 0 0;padding:6px;background:linear-gradient(135deg,#a8813f,#f3dfb0 40%,#b8924f 65%,#f6e5bd)}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:120px 120px 0 0;display:block}
.glow{position:absolute;inset:0;background:radial-gradient(60% 80% at 0 0,rgba(217,183,122,.18),transparent 60%),linear-gradient(90deg,#160a07 52%,rgba(22,10,7,0) 75%)}
.t{position:absolute;left:34px;top:34px;width:380px}
.t img{height:44px;margin-bottom:16px}
.k{font:800 11px Manrope,sans-serif;letter-spacing:.24em;color:#d9b77a;text-transform:uppercase}
h1{font:400 44px/1 Forum,serif;margin-top:8px}
h1 em{font:600 italic 46px 'Cormorant Garamond',serif;background:linear-gradient(120deg,#b8924f,#f3dfb0 45%,#c9a165);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{padding:7px 12px;border-radius:99px;border:1px solid rgba(217,183,122,.45);font:600 13px Manrope,sans-serif;background:rgba(246,240,230,.05)}
.chips span.g{background:linear-gradient(120deg,#b8924f,#f3dfb0 45%,#c9a165);color:#1b0e0a;border:0;font-weight:800}
</style></head><body>
<div class="b"><div class="ph"><img src="../../demo/img/in5.jpg" alt=""></div><div class="glow"></div>
<div class="t"><img src="../../demo/img/logo.png" alt=""><div class="k">ИИ-администратор · 24/7</div><h1>Красота <em>в пару касаний</em></h1>
<div class="chips"><span class="g">📅 Запись онлайн</span><span>💳 Цены</span><span>🎁 Сертификаты</span><span>✨ Перманент</span></div></div></div>
</body></html>
